<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PayroTech - Updating</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 80px 20px; background: #0f172a; color: #fff; }
        h2 { color: #22d3ee; font-size: 2rem; margin-bottom: 12px; }
        p  { color: #94a3b8; font-size: 1rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #22d3ee; border-radius: 50%; animation: spin .8s linear infinite; margin: 24px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>PayroTech is updating...</h2>
    <p>We'll be back in a moment. Please wait.</p>
</body>
</html>
